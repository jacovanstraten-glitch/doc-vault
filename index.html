<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Document Vault</title>
<meta name="description" content="Scan, search and file your documents in your own OneDrive.">
<meta name="theme-color" content="#1E6A55">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data: https:; connect-src 'self' blob: data: https://graph.microsoft.com https://login.microsoftonline.com https://login.live.com https://api.anthropic.com https://*.1drv.com https://*.livefilestore.com https://*.sharepoint.com https://*.microsoftpersonalcontent.com https://*.onedrive.com; frame-src https://login.microsoftonline.com https://login.live.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Document Vault</h1>
      <span class="sync" id="sync" aria-live="polite"></span>
      <span class="hdrbtns">
        <button class="iconbtn" id="btnAdd" aria-label="Add PDF or image files" title="Add PDF or image files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
        <button class="iconbtn" id="btnSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </span>
    </div>
    <div class="seg" id="spaceSeg">
      <button data-space="all" aria-pressed="true">All</button>
      <button data-space="private" aria-pressed="false">Private</button>
      <button data-space="business" aria-pressed="false">Business</button>
    </div>
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search</span><input id="q" type="search" placeholder="Search everything, including text inside documents" autocomplete="off"></label>
  </div>
</header>
<div class="wrap">
  <nav class="chips" id="chips" aria-label="Filter"></nav>
  <div id="notice"></div>
  <label class="dropzone" for="fileIn" id="dropzone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span><b>Drop PDFs or photos here</b>, or click to choose files. Files you save in OneDrive › Document Vault › Inbox are picked up too. The text is read so you can search it later.</span></label>
  <div id="combineBox"></div>
  <div id="importBox"></div>
  <main id="list"></main>
</div>
<button class="fab touch" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan document</button>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="fileIn" accept="application/pdf,.pdf,image/*" multiple hidden>
<div class="dropov" id="dropOverlay" hidden><div>Drop to add to your vault</div></div>
<section class="panel" id="panel" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
